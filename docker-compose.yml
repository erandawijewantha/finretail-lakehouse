services:
  postgres:
    image: postgres:16
    container_name: finretail-postgres
    environment:
      POSTGRES_DB: finretail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - finretail_postgres_data:/var/lib/postgresql/data
    networks:
      -  finretail-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finretail-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finretail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
     - finretail-net

  minio:
    image: minio/minio:latest
    container_name: finretail-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - finretail_minio_data:/data
    networks:
      - finretail-net

volumes:
  finretail_postgres_data:
  finretail_minio_data:

networks:
  finretail-net: