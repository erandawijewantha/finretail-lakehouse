services:
  postgres:
    image: postgres:16
    container_name: finretail-postgres
    environment:
      POSTGRES_DB: finretail
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - finretail_postgres_data:/var/lib/postgresql/data
    networks:
      - finretail-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finretail-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@finretail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - finretail-net

  minio:
    image: minio/minio:latest
    container_name: finretail-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - finretail_minio_data:/data
    networks:
      - finretail-net

  airflow-postgres:
    image: postgres:16
    container_name: finretail-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
      - ./.env:/opt/airflow/.env
      - ./.env.airflow:/opt/airflow/.env
    networks:
      - finretail-net

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: finretail-airflow:latest
    container_name: finretail-airflow-init
    depends_on:
      - airflow-postgres
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      PYTHONPATH: /opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./.env.airflow:/opt/airflow/.env
    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname admin
      --lastname admin
      --role Admin
      --email admin@admin.com || true
      "
    networks:
      - finretail-net

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: finretail-airflow:latest
    container_name: finretail-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST: airflow-scheduler
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
      PYTHONPATH: /opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./.env.airflow:/opt/airflow/.env
    ports:
      - "8080:8080"
    command: airflow webserver
    networks:
      - finretail-net

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: finretail-airflow:latest
    container_name: finretail-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: "finretail_fixed_secret_key_2026"
      AIRFLOW__LOGGING__WORKER_LOG_SERVER_HOST: airflow-scheduler
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
      PYTHONPATH: /opt/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./.env:/opt/airflow/.env
      - ./.env.airflow:/opt/airflow/.env
    command: airflow scheduler
    networks:
      - finretail-net

volumes:
  finretail_postgres_data:
  finretail_minio_data:
  airflow_postgres_data:

networks:
  finretail-net: