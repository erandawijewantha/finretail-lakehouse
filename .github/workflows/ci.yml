name: FinRetail CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Lint check (basic)
        run: |
          pip install flake8
          flake8 src --max-line-length=120 || true

      - name: Run Data Quality checks (local)
        run: |
          uv run python -m src.quality.dq_checks || true